<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="theme-color" content="#0a0a18" />
	<title>Vocab Party</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		/* Use 100dvh so mobile browsers (where the URL bar steals viewport height) get the full available area. */
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			background: #0a0a18;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
			user-select: none;
			-webkit-user-select: none;
		}
		#app {
			width: 100%;
			height: 100%;
			height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #0a0a18;
			padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
			box-sizing: border-box;
		}
		#app canvas {
			display: block;
			max-width: 100%;
			max-height: 100%;
			touch-action: none;
		}
		#rotate-hint {
			display: none;
			position: fixed;
			left: 12px;
			right: 12px;
			top: max(10px, env(safe-area-inset-top));
			z-index: 5;
			pointer-events: none;
			text-align: center;
			padding: 10px 14px;
			border-radius: 12px;
			background: rgba(12, 18, 36, 0.88);
			border: 1px solid rgba(102, 136, 204, 0.45);
			color: #c5d8ff;
			font: 600 14px Fredoka, Arial, sans-serif;
			letter-spacing: 0.02em;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
		}
		@media (orientation: portrait) and (max-aspect-ratio: 4/5) {
			#rotate-hint { display: block; }
		}
		@media (prefers-reduced-motion: reduce) {
			* { scroll-behavior: auto !important; }
		}
	</style>
</head>

<body>
	<div id="rotate-hint">↻ Rotate to landscape for the best party view</div>
	<div id="app"></div>
	<script type="module" src="src/main.ts"></script>
</body>

</html>
