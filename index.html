<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="theme-color" content="#070b14" />
	<title>Vocab Party</title>
	<meta name="description" content="A party board game for word lovers: roll the dice, answer vocab and grammar questions, and battle friends in 20 vocabulary minigames." />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Vocab Party" />
	<meta property="og:description" content="A party board game for word lovers: roll the dice, answer vocab and grammar questions, and battle friends in 20 vocabulary minigames." />
	<meta name="twitter:card" content="summary" />
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Crect x='10' y='10' width='44' height='44' rx='10' fill='%23f4c430'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-size='30' font-weight='900' text-anchor='middle' fill='%23070b14'%3EV%3C/text%3E%3C/svg%3E" />
	<style>
		/* Use 100dvh so mobile browsers (where the URL bar steals viewport height) get the full available area. */
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			height: 100dvh;
			overflow: hidden;
			background: #070b14;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
			user-select: none;
			-webkit-user-select: none;
		}
		#app {
			width: 100%;
			height: 100%;
			height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			/* Letterbox bars match game backdrop so non-16:9 windows look intentional. */
			background: #070b14;
			padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
			box-sizing: border-box;
		}
		/* Phaser sizes the canvas (FIT) via inline style. */
		#app canvas {
			display: block;
			touch-action: none;
		}
		#rotate-hint {
			display: none;
			position: fixed;
			left: 12px;
			right: 12px;
			top: max(10px, env(safe-area-inset-top));
			z-index: 5;
			pointer-events: none;
			text-align: center;
			padding: 10px 14px;
			border-radius: 12px;
			background: rgba(12, 18, 36, 0.88);
			border: 1px solid rgba(102, 136, 204, 0.45);
			color: #c5d8ff;
			font: 600 14px Fredoka, Arial, sans-serif;
			letter-spacing: 0.02em;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
		}
		/* Tall phones: the 16:9 board is unreadable in portrait, so ask for landscape full-screen. */
		@media (orientation: portrait) and (max-aspect-ratio: 4/5) {
			#rotate-hint {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				inset: 0;
				left: 0;
				right: 0;
				top: 0;
				border-radius: 0;
				border: none;
				z-index: 20;
				pointer-events: auto;
				font-size: 22px;
				background: #070b14;
			}
			#rotate-hint::before { content: '📱'; font-size: 64px; transform: rotate(-90deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			* { scroll-behavior: auto !important; }
		}
	</style>
</head>

<body>
	<noscript><p style="color:#fff;font-family:sans-serif;text-align:center;padding:2em">Vocab Party needs JavaScript turned on to play.</p></noscript>
	<div id="rotate-hint">Turn your device sideways to play</div>
	<div id="app"></div>
	<script type="module" src="src/main.ts"></script>
</body>

</html>
