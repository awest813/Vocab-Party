<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>Vocab Party</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		/* Use 100dvh so mobile browsers (where the URL bar steals viewport height) get the full available area. */
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0a0a18; }
		#app {
			width: 100%;
			height: 100%;
			height: 100dvh;
			display: flex;
			align-items: center;
			justify-content: center;
			/* Letterbox bars match game backdrop so non-16:9 windows look intentional. */
			background: #0a0a18;
		}
		/* Phaser sizes the canvas via inline style; just guarantee it never overflows. */
		#app canvas { display: block; max-width: 100%; max-height: 100%; }
		@media (orientation: portrait) and (max-aspect-ratio: 4/5) {
			/* Hint for very narrow portrait devices: the canvas will still scale, but show a subtle rotate prompt via the page background. */
			body::before {
				content: '↻ Rotate for the best experience';
				position: fixed; left: 0; right: 0; top: 8px;
				text-align: center;
				color: #6677aa;
				font: 600 13px Fredoka, Arial, sans-serif;
				pointer-events: none;
				z-index: 2;
			}
		}
	</style>
</head>

<body>
	<div id="app"></div>
	<script type="module" src="src/main.ts"></script>
</body>

</html>
